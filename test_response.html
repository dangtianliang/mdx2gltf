<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战场 - 3D场景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        
        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .scene-info {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
        
        .scene-info h2 {
            margin-bottom: 10px;
            color: #3498db;
        }
        
        .controls {
            margin-top: 10px;
        }
        
        .controls p {
            margin: 5px 0;
        }
        
        /* 错误监控面板样式 */
        .error-monitor {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 350px;
            max-height: 400px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            overflow-y: auto;
            border-left: 4px solid #e74c3c;
        }
        
        .error-monitor h3 {
            margin-bottom: 10px;
            color: #e74c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .error-monitor button {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }
        
        .error-monitor button:hover {
            background-color: #2c3e50;
        }
        
        .error-log {
            margin-bottom: 10px;
            padding: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            word-break: break-all;
        }
        
        .error-log.error {
            border-left: 3px solid #e74c3c;
        }
        
        .error-log.warning {
            border-left: 3px solid #f39c12;
        }
        
        .error-log.info {
            border-left: 3px solid #3498db;
        }
        
        .error-log .timestamp {
            color: #95a5a6;
            font-size: 10px;
            margin-bottom: 3px;
        }
        
        /* 性能监控面板 */
        .performance-monitor {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            border-left: 4px solid #27ae60;
        }
        
        .performance-monitor h3 {
            margin-bottom: 5px;
            color: #27ae60;
            font-size: 12px;
        }
        
        .performance-monitor .metric {
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <!-- 场景容器 -->
    <div id="scene-container"></div>
    <!-- ModelViewer容器 -->
    <div id="model-container"></div>
    
    <!-- 场景信息 -->
    <div class="scene-info">
        <h2>战场</h2>
        <div class="controls">
            <p><strong>控制方式：</strong></p>
            <p>WASD - 移动相机</p>
            <p>鼠标左键 - 旋转视角</p>
            <p>鼠标滚轮 - 缩放</p>
            <p>空格键 - 重置视角</p>
        </div>
    </div>
    
    <!-- 错误监控面板 -->
    <div class="error-monitor">
        <h3>错误监控 <button onclick="clearErrorLogs()">清除日志</button></h3>
        <div id="error-logs-container"></div>
    </div>
    
    <!-- 性能监控面板 -->
    <div class="performance-monitor">
        <h3>性能监控</h3>
        <div class="metric">帧率: <span id="fps-counter">0</span> FPS</div>
        <div class="metric">内存使用: <span id="memory-usage">0</span> MB</div>
        <div class="metric">模型加载时间: <span id="model-load-time">0</span> ms</div>
    </div>
    
    <!-- 引入Three.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入轨道控制器 -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- 引入项目的ModelViewer库 -->
    <script src="../../dist/umd/viewer.min.js"></script>
    
    <script>
        // ==================== 错误监控功能 ====================
        
        // 错误日志容器
        const errorLogsContainer = document.getElementById('error-logs-container');
        
        // 性能监控变量
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        let modelLoadStartTime = 0;
        
        // 日志服务器配置
        const LOG_SERVER_URL = 'http://localhost:8081/api/log';
        
        // 发送日志到服务器
        async function sendLogToServer(logData) {
            try {
                const response = await fetch(LOG_SERVER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(logData)
                });
                const result = await response.json();
                if (!result.success) {
                    console.error('发送日志到服务器失败:', result.message);
                }
            } catch (error) {
                // 发送失败时不影响客户端功能
                console.warn('发送日志到服务器时出错:', error.message);
            }
        }
        
        // 记录错误日志 - 增强版
        function logError(message, type = 'error', details = '') {
            const timestamp = new Date().toLocaleTimeString();
            const errorLog = document.createElement('div');
            errorLog.className = `error-log ${type}`;
            
            let logContent = `<div class="timestamp">${timestamp}</div>`;
            logContent += `<div><strong>${type.toUpperCase()}:</strong> ${message}</div>`;
            
            if (details) {
                logContent += `<div><small>${details}</small></div>`;
            }
            
            errorLog.innerHTML = logContent;
            
            if (errorLogsContainer) {
                errorLogsContainer.insertBefore(errorLog, errorLogsContainer.firstChild);
                
                // 限制日志数量
                if (errorLogsContainer.children.length > 50) {
                    errorLogsContainer.removeChild(errorLogsContainer.lastChild);
                }
            }
            
            // 同时输出到控制台
            switch (type) {
                case 'error':
                    console.error(`[${timestamp}] ${message}`, details);
                    break;
                case 'warning':
                    console.warn(`[${timestamp}] ${message}`, details);
                    break;
                case 'info':
                    console.info(`[${timestamp}] ${message}`, details);
                    break;
            }
            
            // 发送日志到服务器
            const logData = {
                timestamp: new Date().toISOString(),
                level: type,
                message: message,
                details: details,
                browser: {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: {
                        width: screen.width,
                        height: screen.height
                    }
                },
                url: window.location.href,
                referrer: document.referrer
            };
            
            // 异步发送日志，不阻塞主线程
            sendLogToServer(logData);
        }
        
        // 清除错误日志
        function clearErrorLogs() {
            if (errorLogsContainer) {
                errorLogsContainer.innerHTML = '';
            }
            logError('错误日志已清除', 'info');
        }
        
        // 全局错误捕获
        window.onerror = function(message, source, lineno, colno, error) {
            const errorDetails = error ? error.stack : '';
            logError(`JavaScript错误: ${message}`, 'error', `文件: ${source}, 行: ${lineno}, 列: ${colno}\n${errorDetails}`);
            return true; // 阻止默认处理
        };
        
        // 未处理的Promise拒绝捕获 - 增强版
        window.onunhandledrejection = function(event) {
            try {
                const rejectionReason = event.reason;
                const errorDetails = rejectionReason ? (rejectionReason.stack || rejectionReason) : '';
                
                // 检查是否来自ModelViewer
                if (errorDetails.includes('viewer.min.js') || errorDetails.includes('viewer.ts')) {
                    // 隔离ModelViewer的Promise拒绝，防止页面崩溃
                    logError('ModelViewer内部Promise拒绝', 'warning', `原因: ${errorDetails}`);
                    // 阻止默认处理，防止页面崩溃
                    event.preventDefault();
                } else {
                    // 其他Promise拒绝
                    logError('未处理的Promise拒绝', 'error', `原因: ${errorDetails}`);
                }
            } catch (e) {
                console.error('处理Promise拒绝时出错:', e);
            }
        };
        
        // 增强的全局错误处理
        window.onerror = function(message, source, lineno, colno, error) {
            try {
                const errorDetails = error ? error.stack : '';
                
                // 检查是否来自ModelViewer
                if (source && (source.includes('viewer.min.js') || source.includes('viewer.ts'))) {
                    // 隔离ModelViewer的错误，防止页面崩溃
                    logError('ModelViewer内部错误', 'warning', `消息: ${message}, 文件: ${source}, 行: ${lineno}, 列: ${colno}\n${errorDetails}`);
                    // 阻止默认处理，防止页面崩溃
                    return true;
                } else {
                    // 其他JavaScript错误
                    logError(`JavaScript错误: ${message}`, 'error', `文件: ${source}, 行: ${lineno}, 列: ${colno}\n${errorDetails}`);
                    return true;
                }
            } catch (e) {
                console.error('处理全局错误时出错:', e);
                return true;
            }
        };
        
        // 网络请求错误监控
        function monitorNetworkErrors() {
            // 监控XMLHttpRequest错误
            const originalXHROpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                logError(`XHR请求: ${method} ${url}`, 'info');
                this.addEventListener('error', function() {
                    logError(`XHR网络请求错误: ${url}`, 'warning', `状态: ${this.status}, 状态文本: ${this.statusText}`);
                });
                this.addEventListener('load', function() {
                    logError(`XHR请求成功: ${url}, 状态: ${this.status}`, 'info');
                });
                this.addEventListener('abort', function() {
                    logError(`XHR请求被中止: ${url}`, 'error');
                });
                return originalXHROpen.apply(this, arguments);
            };
            
            // 监控Fetch API错误
            const originalFetch = window.fetch;
            window.fetch = function(url, options) {
                logError(`Fetch请求: ${options?.method || 'GET'} ${url}`, 'info');
                return originalFetch(url, options)
                    .then(response => {
                        logError(`Fetch请求成功: ${url}, 状态: ${response.status}`, 'info');
                        return response;
                    })
                    .catch(error => {
                        logError(`Fetch API错误: ${url}`, 'warning', error.message);
                        throw error; // 重新抛出错误以便其他代码处理
                    });
            };
        }
        
        // 性能监控
        function updatePerformanceMetrics() {
            // 计算帧率
            const currentTime = performance.now();
            frameCount++;
            
            if (currentTime - lastFrameTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastFrameTime));
                frameCount = 0;
                lastFrameTime = currentTime;
                
                const fpsCounter = document.getElementById('fps-counter');
                if (fpsCounter) {
                    fpsCounter.textContent = fps;
                }
            }
            
            // 监控内存使用
            if (performance.memory) {
                const memoryUsage = Math.round(performance.memory.usedJSHeapSize / 1024 / 1024);
                const memoryCounter = document.getElementById('memory-usage');
                if (memoryCounter) {
                    memoryCounter.textContent = memoryUsage;
                }
            }
            
            requestAnimationFrame(updatePerformanceMetrics);
        }
        
        // 初始化监控
        function initMonitoring() {
            logError('错误监控已初始化', 'info');
            // 暂时禁用网络请求监控，避免干扰正常请求
            // monitorNetworkErrors();
            updatePerformanceMetrics();
        }
        
        // 初始化监控
        initMonitoring();
        
        // ==================== 场景设置 ====================
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 天空蓝色
        
        // 相机设置
        const camera = new THREE.PerspectiveCamera(
            75, // 视野角度
            window.innerWidth / window.innerHeight, // 宽高比
            0.1, // 近裁剪面
            1000 // 远裁剪面
        );
        camera.position.set(5, 5, 5); // 相机位置
        camera.lookAt(0, 0, 0); // 相机看向原点
        
        // 渲染器设置
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('scene-container').appendChild(renderer.domElement);
        
        // 添加轨道控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 启用阻尼效果
        controls.dampingFactor = 0.05; // 阻尼系数
        
        // 添加地面网格
        function createGroundGrid() {
            // 创建地面
            const groundGeometry = new THREE.PlaneGeometry(20, 20, 20, 20);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x4caf50,
                side: THREE.DoubleSide,
                wireframe: false
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2; // 旋转地面使其水平
            ground.position.y = -0.5; // 地面位置
            ground.receiveShadow = true;
            scene.add(ground);
            
            // 创建网格辅助线
            const gridHelper = new THREE.GridHelper(20, 20, 0xffffff, 0x888888);
            gridHelper.position.y = -0.499; // 略微高于地面
            scene.add(gridHelper);
        }
        
        // 添加光源
        function addLights() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            // 方向光（模拟太阳光）
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            directionalLight.shadow.camera.left = -10;
            directionalLight.shadow.camera.right = 10;
            directionalLight.shadow.camera.top = 10;
            directionalLight.shadow.camera.bottom = -10;
            scene.add(directionalLight);
            
            // 添加方向光辅助线
            // const directionalLightHelper = new THREE.DirectionalLightHelper(directionalLight, 1);
            // scene.add(directionalLightHelper);
        }
        
        // 初始化ModelViewer
        let modelViewer, modelScene, archnathidModel, archnathidInstance;
        
        function initModelViewer() {
            // 延迟初始化ModelViewer，确保Three.js场景优先显示
            setTimeout(() => {
                try {
                    logError('开始初始化ModelViewer...', 'info');
                    
                    // 创建ModelViewer容器
                    const modelContainer = document.getElementById('model-container');
                    if (!modelContainer) {
                        logError('ModelViewer容器不存在', 'error');
                        return;
                    }
                    
                    // 创建canvas用于ModelViewer
                    const modelCanvas = document.createElement('canvas');
                    modelCanvas.id = 'model-canvas';
                    modelCanvas.width = window.innerWidth;
                    modelCanvas.height = window.innerHeight;
                    modelCanvas.style.position = 'absolute';
                    modelCanvas.style.top = '0';
                    modelCanvas.style.left = '0';
                    modelCanvas.style.pointerEvents = 'none'; // 让鼠标事件穿透到Three.js场景
                    modelContainer.appendChild(modelCanvas);
                    
                    // 检查ModelViewer库是否加载
                    if (!ModelViewer || !ModelViewer.viewer || !ModelViewer.viewer.ModelViewer) {
                        logError('ModelViewer库未正确加载', 'error');
                        return;
                    }
                    
                    // 创建ModelViewer实例
                    try {
                        modelViewer = new ModelViewer.viewer.ModelViewer(modelCanvas);
                        logError('ModelViewer实例创建成功', 'info');
                    } catch (e) {
                        logError('创建ModelViewer实例时出错', 'error', e.stack);
                        return;
                    }
                    
                    // 添加处理器
                    try {
                        if (ModelViewer.viewer.handlers) {
                            if (ModelViewer.viewer.handlers.mdx) {
                                modelViewer.addHandler(ModelViewer.viewer.handlers.mdx);
                                logError('MDX处理器添加成功', 'info');
                            } else {
                                logError('MDX处理器不存在', 'warning');
                            }
                            if (ModelViewer.viewer.handlers.blp) {
                                modelViewer.addHandler(ModelViewer.viewer.handlers.blp);
                                logError('BLP处理器添加成功', 'info');
                            } else {
                                logError('BLP处理器不存在', 'warning');
                            }
                            // 检查是否有其他可用的处理器
                            for (const handlerName in ModelViewer.viewer.handlers) {
                                if (handlerName !== 'mdx' && handlerName !== 'blp') {
                                    try {
                                        modelViewer.addHandler(ModelViewer.viewer.handlers[handlerName]);
                                        logError(`${handlerName}处理器添加成功`, 'info');
                                    } catch (e) {
                                        logError(`添加${handlerName}处理器时出错`, 'warning', e.stack);
                                    }
                                }
                            }
                        } else {
                            logError('ModelViewer处理器未加载', 'error');
                            return;
                        }
                    } catch (e) {
                        logError('添加处理器时出错', 'error', e.stack);
                    }
                    
                    // 创建场景
                    try {
                        modelScene = modelViewer.addScene();
                        if (modelScene) {
                            logError('ModelViewer场景创建成功', 'info');
                        } else {
                            logError('无法创建ModelViewer场景', 'error');
                            return;
                        }
                    } catch (e) {
                        logError('创建ModelViewer场景时出错', 'error', e.stack);
                        return;
                    }
                    
                    // 添加增强的ModelViewer事件监听器
                    try {
                        // 监听ModelViewer的所有可能事件
                        if (modelViewer.on) {
                            // 监听错误事件 - 增强版
                            modelViewer.on('error', (errorEvent) => {
                                try {
                                    // 分析错误类型
                                    const errorMessage = errorEvent.error || errorEvent.message || 'Unknown error';
                                    const fetchUrl = errorEvent.fetchUrl || 'Unknown URL';
                                    
                                    // 分类处理错误
                                    if (errorMessage.includes('no matching handler')) {
                                        // 处理器匹配错误 - 非致命
                                        logError('ModelViewer处理器匹配错误', 'warning', `错误: ${errorMessage}, URL: ${fetchUrl}`);
                                    } else if (errorMessage.includes('Http Error')) {
                                        // HTTP错误 - 非致命
                                        logError('ModelViewer资源加载错误', 'warning', `错误: ${errorMessage}, URL: ${fetchUrl}`);
                                    } else {
                                        // 其他错误
                                        logError('ModelViewer错误事件', 'error', errorEvent);
                                    }
                                } catch (e) {
                                    console.error('处理ModelViewer错误事件时出错:', e);
                                }
                            });
                            // 监听加载事件
                            modelViewer.on('load', (data) => {
                                logError('ModelViewer加载事件', 'info', data);
                            });
                            // 监听其他可能的事件，防止未处理的错误
                            modelViewer.on('frame', () => {
                                // 静默处理帧事件
                            });
                            modelViewer.on('update', () => {
                                // 静默处理更新事件
                            });
                            modelViewer.on('render', () => {
                                // 静默处理渲染事件
                            });
                            // 监听资源加载事件
                            modelViewer.on('resource', (resource) => {
                                logError('ModelViewer资源加载事件', 'info', resource);
                            });
                        } else if (modelViewer.addEventListener) {
                            modelViewer.addEventListener('error', (errorEvent) => {
                                try {
                                    const errorData = errorEvent.detail || errorEvent;
                                    logError('ModelViewer错误事件', 'error', errorData);
                                } catch (e) {
                                    console.error('处理ModelViewer错误事件时出错:', e);
                                }
                            });
                            modelViewer.addEventListener('load', (event) => {
                                logError('ModelViewer加载事件', 'info', event.detail || event);
                            });
                        }
                        logError('ModelViewer事件监听器添加成功', 'info');
                    } catch (e) {
                        logError('添加ModelViewer事件监听器失败', 'warning', e.stack);
                    }
                    
                    // 增强的路径解析器 - 智能处理
                    function pathSolver(src) {
                        try {
                            logError(`路径解析请求: ${src}`, 'info');
                            
                            // 处理ReplaceableTextures和Splats路径
                            if (src.includes('ReplaceableTextures')) {
                                // 构建正确的ReplaceableTextures路径
                                const relativePath = src.replace(/\\/g, '/');
                                return relativePath;
                            } else if (src.includes('Splats')) {
                                // 跳过Splats路径
                                return '';
                            } else {
                                // 处理其他纹理路径
                                const fileName = src.split('\\').pop().split('/').pop();
                                const resolvedPath = `../../src/model/Creeps/Archnathid/${fileName}`;
                                logError(`解析路径: ${src} -> ${resolvedPath}`, 'info');
                                return resolvedPath;
                            }
                        } catch (e) {
                            logError('路径解析器出错', 'error', e.stack);
                            return '';
                        }
                    }
                    
                    // 加载模型（可选，失败不影响Three.js场景）
                    try {
                        const modelPath = '../../src/model/Creeps/Archnathid/Archnathid.mdx';
                        modelLoadStartTime = performance.now();
                        
                        modelViewer.load(modelPath, pathSolver).then((model) => {
                            const modelLoadTime = Math.round(performance.now() - modelLoadStartTime);
                            document.getElementById('model-load-time').textContent = modelLoadTime;
                            
                            if (model) {
                                logError(`Archnathid模型加载成功！加载时间: ${modelLoadTime}ms`, 'info');
                                archnathidModel = model;
                                
                                try {
                                    archnathidInstance = model.addInstance();
                                    if (archnathidInstance) {
                                        archnathidInstance.setScene(modelScene);
                                        archnathidInstance.setSequence(0);
                                        archnathidInstance.setSequenceLoopMode(2);
                                        logError('Archnathid模型实例创建成功！', 'info');
                                    }
                                } catch (e) {
                                    logError('创建模型实例时出错', 'error', e.stack);
                                }
                            } else {
                                logError('Archnathid模型加载失败！', 'error');
                            }
                        }).catch(error => {
                            logError('加载模型时出错', 'error', error.message);
                        });
                    } catch (e) {
                        logError('启动模型加载时出错', 'error', e.stack);
                    }
                    
                } catch (initError) {
                    logError('初始化ModelViewer时出错', 'error', initError.stack);
                }
            }, 2000); // 延迟2秒初始化ModelViewer
        }
        
        // 同步相机位置
        function syncCameras() {
            if (modelScene && modelScene.camera) {
                // 注意：ModelViewer的相机API与Three.js不同
                // 为了避免累积移动，我们使用一个固定的相机位置
                // 这样可以确保模型在场景中可见，同时避免错误
                
                // 使用一个合理的固定相机位置
                const cameraPosition = [500, 500, 500];
                
                // 简化处理：直接设置相机位置
                // 由于ModelViewer的相机API可能不支持直接设置位置
                // 我们使用一个简单的方法，确保模型在场景中可见
                // 注意：这里可能需要根据ModelViewer的实际API进行调整
            }
        }
        
        // 处理窗口大小变化
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // 更新ModelViewer canvas大小
            if (document.getElementById('model-canvas')) {
                const modelCanvas = document.getElementById('model-canvas');
                modelCanvas.width = window.innerWidth;
                modelCanvas.height = window.innerHeight;
                modelScene.viewport[2] = window.innerWidth;
                modelScene.viewport[3] = window.innerHeight;
                modelScene.camera.perspective(Math.PI / 4, window.innerWidth / window.innerHeight, 1, 200000);
            }
        });
        
        // 处理键盘事件（WASD移动相机）
        const keys = {};
        window.addEventListener('keydown', (event) => {
            keys[event.code] = true;
            
            // 空格键重置视角
            if (event.code === 'Space') {
                camera.position.set(5, 5, 5);
                camera.lookAt(0, 0, 0);
                controls.reset();
                // 移除对syncCameras的调用，避免错误
            }
        });
        
        window.addEventListener('keyup', (event) => {
            keys[event.code] = false;
        });
        
        // 移动相机
        function moveCamera() {
            const speed = 0.1;
            
            if (keys['KeyW']) {
                camera.position.z -= speed;
            }
            if (keys['KeyS']) {
                camera.position.z += speed;
            }
            if (keys['KeyA']) {
                camera.position.x -= speed;
            }
            if (keys['KeyD']) {
                camera.position.x += speed;
            }
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 移动相机
            try {
                moveCamera();
            } catch (e) {
                logError('移动相机时出错', 'error', e.stack);
            }
            
            // 更新控制器
            try {
                controls.update();
            } catch (e) {
                logError('更新控制器时出错', 'error', e.stack);
            }
            
            // 更新ModelViewer - 增强错误隔离
            try {
                if (modelViewer) {
                    // 使用try-catch包裹ModelViewer的updateAndRender
                    try {
                        modelViewer.updateAndRender();
                    } catch (mvError) {
                        // 记录ModelViewer更新错误，但不影响Three.js渲染
                        logError('ModelViewer更新渲染出错', 'warning', mvError.stack || mvError.message);
                    }
                }
            } catch (e) {
                // 只记录警告，不影响Three.js渲染
                logError('更新ModelViewer时出错', 'warning', e.stack);
            }
            
            // 渲染场景 - 确保即使ModelViewer出错也能继续渲染
            try {
                renderer.render(scene, camera);
            } catch (e) {
                logError('渲染Three.js场景时出错', 'error', e.stack);
            }
        }
        
        // 初始化场景
        function initScene() {
            try {
                logError('开始初始化场景...', 'info');
                
                // 先初始化Three.js场景，确保基本显示
                try {
                    createGroundGrid();
                    logError('地面网格创建成功', 'info');
                } catch (e) {
                    logError('创建地面网格时出错', 'error', e.stack);
                }
                
                try {
                    addLights();
                    logError('光源添加成功', 'info');
                } catch (e) {
                    logError('添加光源时出错', 'error', e.stack);
                }
                
                // 启动动画循环，确保Three.js场景能显示
                try {
                    animate();
                    logError('动画循环启动成功', 'info');
                } catch (e) {
                    logError('启动动画循环时出错', 'error', e.stack);
                }
                
                // 最后初始化ModelViewer，即使失败也不影响Three.js场景
                try {
                    initModelViewer();
                    logError('ModelViewer初始化启动', 'info');
                } catch (e) {
                    logError('初始化ModelViewer时出错', 'error', e.stack);
                    // ModelViewer初始化失败不影响Three.js场景
                }
                
                logError('场景初始化完成', 'info');
            } catch (initError) {
                logError('场景初始化时出错', 'error', initError.stack);
                // 即使初始化出错，也要尝试启动动画循环
                try {
                    animate();
                } catch (e) {
                    logError('尝试启动动画循环时出错', 'error', e.stack);
                }
            }
        }
        
        // 启动场景
        initScene();
    </script>
</body>
