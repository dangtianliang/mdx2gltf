<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLTF 动画验证</title>
    <!-- Three.js & GLTFLoader -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #info-panel { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.8); padding: 15px; border-radius: 8px; color: white; max-width: 300px; }
        #info-panel h1 { margin: 0 0 10px 0; font-size: 18px; }
        #info-panel p { margin: 5px 0; font-size: 14px; }
        #info-panel .error { color: #ef4444; }
        #info-panel .success { color: #22c55e; }
        #animation-list { margin-top: 10px; }
        #animation-list button { display: block; width: 100%; margin: 5px 0; padding: 8px; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.5); border-radius: 4px; color: white; cursor: pointer; text-align: left; }
        #animation-list button:hover { background: rgba(59, 130, 246, 0.3); }
        #animation-list button.active { background: rgba(59, 130, 246, 0.4); border-color: #3b82f6; }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Info Panel -->
    <div id="info-panel">
        <h1>GLTF 动画验证</h1>
        <p>模型: <span id="model-name">export.gltf</span></p>
        <input type="file" id="file-input" accept=".gltf,.glb" style="margin: 10px 0; width: 100%;">
        <p id="status">加载中...</p>
        <div id="animation-list"></div>
        <hr style="border-color: rgba(255,255,255,0.2); margin: 10px 0;">
        <div id="debug-info" style="font-size: 12px; font-family: monospace;">
            <p>Object06 pos: <span id="obj06-pos">-</span></p>
            <p>Object06 rot: <span id="obj06-rot">-</span></p>
            <p>gutz00 pos: <span id="gutz00-pos">-</span></p>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

        // Global variables
        let scene, camera, renderer, controls;
        let mixer, currentAction, model;
        let animations = [];
        let clock = new THREE.Clock();
        let isLooping = true;
        let playbackSpeed = 1.0;

        // UI Elements
        const statusEl = document.getElementById('status');
        const animationListEl = document.getElementById('animation-list');
        const modelNameEl = document.getElementById('model-name');
        const fileInputEl = document.getElementById('file-input');

        init();
        animate();

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 10);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 2, 0);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Load the initial export.gltf model
            loadModel('export.gltf');

            // File input event listener
            fileInputEl.addEventListener('change', handleFileSelect);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            modelNameEl.textContent = file.name;
            statusEl.innerHTML = '加载中...';
            animationListEl.innerHTML = '';

            // Create a URL for the selected file
            const fileURL = URL.createObjectURL(file);
            loadModel(fileURL, file.name);
        }

        function loadModel(modelUrl, modelName = 'export.gltf') {
            const loader = new GLTFLoader();
            
            loader.load(modelUrl, (gltf) => {
                statusEl.innerHTML = '<span class="success">模型加载成功！</span>';
                
                // Remove old model
                if (model) scene.remove(model);

                model = gltf.scene;
                scene.add(model);

                // Setup animations
                if (gltf.animations && gltf.animations.length > 0) {
                    statusEl.innerHTML += '<br><span class="success">发现 ' + gltf.animations.length + ' 个动画</span>';
                    
                    mixer = new THREE.AnimationMixer(model);
                    
                    animations = gltf.animations.map((clip, idx) => {
                        return {
                            name: clip.name || `Animation ${idx + 1}`,
                            duration: clip.duration,
                            clip: clip
                        };
                    });
                    
                    renderAnimationList();
                    
                    // Auto play first animation
                    if (animations.length > 0) {
                        playAnimation(0);
                    }
                } else {
                    statusEl.innerHTML += '<br><span class="error">未发现动画</span>';
                }

                // Center camera
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(center.x + maxDim, center.y + maxDim * 0.5, center.z + maxDim);
                controls.target.copy(center);
                controls.update();

            }, undefined, (error) => {
                console.error('Error loading model:', error);
                statusEl.innerHTML = '<span class="error">加载失败: ' + error.message + '</span>';
            });
        }

        function renderAnimationList() {
            animationListEl.innerHTML = '';
            animations.forEach((anim, index) => {
                const btn = document.createElement('button');
                btn.textContent = anim.name + ' (' + anim.duration.toFixed(2) + 's)';
                btn.onclick = () => playAnimation(index);
                animationListEl.appendChild(btn);
            });
        }

        function playAnimation(index) {
            if (!animations[index]) return;

            const animName = animations[index].name;

            // Update UI
            document.querySelectorAll('#animation-list button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#animation-list button')[index].classList.add('active');

            // Reset previous
            if (currentAction) {
                currentAction.stop();
            }

            // Play the animation
            const clip = animations[index].clip;
            currentAction = mixer.clipAction(clip);
            
            currentAction.setLoop(isLooping ? THREE.LoopRepeat : THREE.LoopOnce);
            currentAction.clampWhenFinished = !isLooping;
            
            currentAction.play();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            
            // 限制delta值，避免动画播放过快
            const cappedDelta = Math.min(delta, 0.1);
            
            if (mixer) {
                mixer.update(cappedDelta * playbackSpeed);
                
                // Update debug display for key objects
                const obj06 = model.getObjectByName('Object06');
                const gutz00 = model.getObjectByName('gutz00');
                
                if (obj06) {
                    const pos = obj06.position;
                    const rot = obj06.rotation;
                    document.getElementById('obj06-pos').textContent = 
                        `${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)}`;
                    document.getElementById('obj06-rot').textContent = 
                        `${rot.x.toFixed(2)}, ${rot.y.toFixed(2)}, ${rot.z.toFixed(2)}`;
                }
                
                if (gutz00) {
                    const pos = gutz00.position;
                    document.getElementById('gutz00-pos').textContent = 
                        `${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)}`;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
