<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js + ModelViewer 兼容测试</title>
  <!-- 引入必要的库 -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .section {
      flex: 1;
      padding: 20px;
      box-sizing: border-box;
    }
    #three-container {
      background: #f0f0f0;
      border-right: 1px solid #ccc;
    }
    #modelviewer-container {
      background: #e0e0e0;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #333;
    }
    .scene-container {
      width: 100%;
      height: calc(100% - 40px);
      background: #000;
      border-radius: 4px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Three.js 容器 -->
    <div class="section">
      <h2>Three.js 场景</h2>
      <div class="scene-container" id="three-container"></div>
    </div>
    <!-- ModelViewer 容器 -->
    <div class="section">
      <h2>ModelViewer 模型</h2>
      <div class="scene-container" id="modelviewer-container"></div>
    </div>
  </div>

  <!-- 引入应用脚本 -->
  <script src="app.js"></script>
</body>
</html>
