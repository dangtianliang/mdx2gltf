<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战场 - 3D场景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        
        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .scene-info {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
        
        .scene-info h2 {
            margin-bottom: 10px;
            color: #3498db;
        }
        
        .controls {
            margin-top: 10px;
        }
        
        .controls p {
            margin: 5px 0;
        }
        
        .debug-buttons {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .debug-buttons button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            background-color: rgba(52, 152, 219, 0.3);
            color: white;
            border: 1px solid rgba(52, 152, 219, 0.5);
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .debug-buttons button:hover {
            background-color: rgba(52, 152, 219, 0.5);
        }
        
        .debug-buttons button:active {
            background-color: rgba(52, 152, 219, 0.7);
        }
        
        .debug-buttons button:disabled {
            background-color: rgba(100, 100, 100, 0.3);
            border-color: rgba(100, 100, 100, 0.5);
            cursor: not-allowed;
        }
        
        /* 错误监控面板样式 */
        .error-monitor {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 350px;
            max-height: 400px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            overflow-y: auto;
            border-left: 4px solid #e74c3c;
        }
        
        .error-monitor h3 {
            margin-bottom: 10px;
            color: #e74c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .error-monitor button {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }
        
        .error-monitor button:hover {
            background-color: #2c3e50;
        }
        
        .error-log {
            margin-bottom: 10px;
            padding: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            word-break: break-all;
        }
        
        .error-log.error {
            border-left: 3px solid #e74c3c;
        }
        
        .error-log.warning {
            border-left: 3px solid #f39c12;
        }
        
        .error-log.info {
            border-left: 3px solid #3498db;
        }
        
        .error-log .timestamp {
            color: #95a5a6;
            font-size: 10px;
            margin-bottom: 3px;
        }
        
        /* 性能监控面板 */
        .performance-monitor {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            border-left: 4px solid #27ae60;
        }
        
        .performance-monitor h3 {
            margin-bottom: 5px;
            color: #27ae60;
            font-size: 12px;
        }
        
        .performance-monitor .metric {
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <!-- 场景容器 -->
    <div id="scene-container"></div>
    <!-- ModelViewer容器 -->
    <div id="model-container"></div>
    
    <!-- 场景信息 -->
    <div class="scene-info">
        <h2>战场</h2>
        <div class="controls">
            <p><strong>控制方式：</strong></p>
            <p>WASD - 移动相机</p>
            <p>鼠标左键 - 旋转视角</p>
            <p>鼠标滚轮 - 缩放</p>
            <p>空格键 - 重置视角</p>
        </div>
        <div class="debug-buttons">
            <p><strong>调试控制：</strong></p>
            <button onclick="toggleModelViewerRender()" id="toggleRenderBtn">启用ModelViewer渲染</button>
            <button onclick="reloadArchnathidModel()">重新加载Archnathid模型</button>
            <button onclick="resetModelViewer()">重置ModelViewer</button>
            <button onclick="testModelViewer()">测试ModelViewer功能</button>
            <button onclick="clearErrorLogs()">清除错误日志</button>
        </div>
    </div>
    
    <!-- 错误监控面板 -->
    <div class="error-monitor">
        <h3>错误监控 <button onclick="clearErrorLogs()">清除日志</button></h3>
        <div id="error-logs-container"></div>
    </div>
    
    <!-- 性能监控面板 -->
    <div class="performance-monitor">
        <h3>性能监控</h3>
        <div class="metric">帧率: <span id="fps-counter">0</span> FPS</div>
        <div class="metric">内存使用: <span id="memory-usage">0</span> MB</div>
        <div class="metric">模型加载时间: <span id="model-load-time">0</span> ms</div>
    </div>
    
    <!-- 引入Three.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入轨道控制器 -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- 引入项目的ModelViewer库 -->
    <script src="../../dist/umd/viewer.min.js"></script>
    
    <script>
        // ==================== 错误监控功能 ====================
        
        // 错误日志容器
        const errorLogsContainer = document.getElementById('error-logs-container');
        
        // 性能监控变量
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        let modelLoadStartTime = 0;
        
        // ModelViewer错误状态
        let modelError = false;
        let errorCount = 0;
        const MAX_ERRORS = 50; // 最大错误数限制
        
        // 日志服务器配置
        const LOG_SERVER_URL = 'http://localhost:8081/api/log';
        
        // 发送日志到服务器
        async function sendLogToServer(logData) {
            try {
                const response = await fetch(LOG_SERVER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(logData)
                });
                const result = await response.json();
                if (!result.success) {
                    console.error('发送日志到服务器失败:', result.message);
                }
            } catch (error) {
                // 发送失败时不影响客户端功能
                console.warn('发送日志到服务器时出错:', error.message);
            }
        }
        
        // 记录错误日志 - 增强版
        function logError(message, type = 'error', details = '') {
            // 限制错误数量，避免内存泄漏
            if (type === 'error' || type === 'warning') {
                errorCount++;
                if (errorCount > MAX_ERRORS) {
                    // 每类错误只记录一次，避免重复日志
                    if (!message.includes('重复错误')) {
                        logError('错误数量达到上限，后续错误将被忽略', 'warning');
                    }
                    return;
                }
            }
            
            const timestamp = new Date().toLocaleTimeString();
            const errorLog = document.createElement('div');
            errorLog.className = `error-log ${type}`;
            
            let logContent = `<div class="timestamp">${timestamp}</div>`;
            logContent += `<div><strong>${type.toUpperCase()}:</strong> ${message}</div>`;
            
            if (details) {
                logContent += `<div><small>${details}</small></div>`;
            }
            
            errorLog.innerHTML = logContent;
            
            if (errorLogsContainer) {
                errorLogsContainer.insertBefore(errorLog, errorLogsContainer.firstChild);
                
                // 限制日志数量
                if (errorLogsContainer.children.length > 50) {
                    errorLogsContainer.removeChild(errorLogsContainer.lastChild);
                }
            }
            
            // 同时输出到控制台
            switch (type) {
                case 'error':
                    console.error(`[${timestamp}] ${message}`, details);
                    break;
                case 'warning':
                    console.warn(`[${timestamp}] ${message}`, details);
                    break;
                case 'info':
                    console.info(`[${timestamp}] ${message}`, details);
                    break;
            }
            
            // 发送日志到服务器
            const logData = {
                timestamp: new Date().toISOString(),
                level: type,
                message: message,
                details: details,
                browser: {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: {
                        width: screen.width,
                        height: screen.height
                    }
                },
                url: window.location.href,
                referrer: document.referrer
            };
            
            // 异步发送日志，不阻塞主线程
            sendLogToServer(logData);
        }
        
        // 清除错误日志
        function clearErrorLogs() {
            if (errorLogsContainer) {
                errorLogsContainer.innerHTML = '';
            }
            logError('错误日志已清除', 'info');
        }
        
        // 全局错误捕获
        window.onerror = function(message, source, lineno, colno, error) {
            const errorDetails = error ? error.stack : '';
            logError(`JavaScript错误: ${message}`, 'error', `文件: ${source}, 行: ${lineno}, 列: ${colno}\n${errorDetails}`);
            return true; // 阻止默认处理
        };
        
        // 未处理的Promise拒绝捕获 - 增强版
        window.onunhandledrejection = function(event) {
            try {
                const rejectionReason = event.reason;
                const errorDetails = rejectionReason ? (rejectionReason.stack || rejectionReason) : '';
                
                // 检查是否来自ModelViewer
                if (errorDetails.includes('viewer.min.js') || errorDetails.includes('viewer.ts')) {
                    // 隔离ModelViewer的Promise拒绝，防止页面崩溃
                    logError('ModelViewer内部Promise拒绝', 'warning', `原因: ${errorDetails}`);
                    // 阻止默认处理，防止页面崩溃
                    event.preventDefault();
                } else {
                    // 其他Promise拒绝
                    logError('未处理的Promise拒绝', 'error', `原因: ${errorDetails}`);
                }
            } catch (e) {
                console.error('处理Promise拒绝时出错:', e);
            }
        };
        
        // 增强的全局错误处理
        window.onerror = function(message, source, lineno, colno, error) {
            try {
                const errorDetails = error ? error.stack : '';
                
                // 检查是否来自ModelViewer
                if (source && (source.includes('viewer.min.js') || source.includes('viewer.ts'))) {
                    // 隔离ModelViewer的错误，防止页面崩溃
                    logError('ModelViewer内部错误', 'warning', `消息: ${message}, 文件: ${source}, 行: ${lineno}, 列: ${colno}\n${errorDetails}`);
                    // 阻止默认处理，防止页面崩溃
                    return true;
                } else {
                    // 其他JavaScript错误
                    logError(`JavaScript错误: ${message}`, 'error', `文件: ${source}, 行: ${lineno}, 列: ${colno}\n${errorDetails}`);
                    return true;
                }
            } catch (e) {
                console.error('处理全局错误时出错:', e);
                return true;
            }
        };
        
        // 网络请求错误监控
        function monitorNetworkErrors() {
            // 监控XMLHttpRequest错误
            const originalXHROpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                logError(`XHR请求: ${method} ${url}`, 'info');
                this.addEventListener('error', function() {
                    logError(`XHR网络请求错误: ${url}`, 'warning', `状态: ${this.status}, 状态文本: ${this.statusText}`);
                });
                this.addEventListener('load', function() {
                    logError(`XHR请求成功: ${url}, 状态: ${this.status}`, 'info');
                });
                this.addEventListener('abort', function() {
                    logError(`XHR请求被中止: ${url}`, 'error');
                });
                return originalXHROpen.apply(this, arguments);
            };
            
            // 监控Fetch API错误
            const originalFetch = window.fetch;
            window.fetch = function(url, options) {
                logError(`Fetch请求: ${options?.method || 'GET'} ${url}`, 'info');
                return originalFetch(url, options)
                    .then(response => {
                        logError(`Fetch请求成功: ${url}, 状态: ${response.status}`, 'info');
                        return response;
                    })
                    .catch(error => {
                        logError(`Fetch API错误: ${url}`, 'warning', error.message);
                        throw error; // 重新抛出错误以便其他代码处理
                    });
            };
        }
        
        // 性能监控
        function updatePerformanceMetrics() {
            // 计算帧率
            const currentTime = performance.now();
            frameCount++;
            
            if (currentTime - lastFrameTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastFrameTime));
                frameCount = 0;
                lastFrameTime = currentTime;
                
                const fpsCounter = document.getElementById('fps-counter');
                if (fpsCounter) {
                    fpsCounter.textContent = fps;
                }
            }
            
            // 监控内存使用
            if (performance.memory) {
                const memoryUsage = Math.round(performance.memory.usedJSHeapSize / 1024 / 1024);
                const memoryCounter = document.getElementById('memory-usage');
                if (memoryCounter) {
                    memoryCounter.textContent = memoryUsage;
                }
            }
            
            requestAnimationFrame(updatePerformanceMetrics);
        }
        
        // 初始化监控
        function initMonitoring() {
            logError('错误监控已初始化', 'info');
            // 暂时禁用网络请求监控，避免干扰正常请求
            // monitorNetworkErrors();
            updatePerformanceMetrics();
        }
        
        // 初始化监控
        initMonitoring();
        
        // ==================== 场景设置 ====================
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 天空蓝色
        
        // 相机设置
        const camera = new THREE.PerspectiveCamera(
            75, // 视野角度
            window.innerWidth / window.innerHeight, // 宽高比
            0.1, // 近裁剪面
            1000 // 远裁剪面
        );
        camera.position.set(5, 5, 5); // 相机位置
        camera.lookAt(0, 0, 0); // 相机看向原点
        
        // 渲染器设置
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('scene-container').appendChild(renderer.domElement);
        
        // 添加轨道控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 启用阻尼效果
        controls.dampingFactor = 0.05; // 阻尼系数
        
        // 添加地面网格
        function createGroundGrid() {
            // 创建地面
            const groundGeometry = new THREE.PlaneGeometry(20, 20, 20, 20);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x4caf50,
                side: THREE.DoubleSide,
                wireframe: false
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2; // 旋转地面使其水平
            ground.position.y = -0.5; // 地面位置
            ground.receiveShadow = true;
            scene.add(ground);
            
            // 创建网格辅助线
            const gridHelper = new THREE.GridHelper(20, 20, 0xffffff, 0x888888);
            gridHelper.position.y = -0.499; // 略微高于地面
            scene.add(gridHelper);
        }
        
        // 添加光源
        function addLights() {
            // 环境光 - 增强亮度
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            // 方向光（模拟太阳光）- 增强亮度
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(10, 15, 8);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            directionalLight.shadow.camera.left = -10;
            directionalLight.shadow.camera.right = 10;
            directionalLight.shadow.camera.top = 10;
            directionalLight.shadow.camera.bottom = -10;
            scene.add(directionalLight);
            
            // 添加第二个方向光，从不同角度照射
            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight2.position.set(-8, 10, -5);
            scene.add(directionalLight2);
            
            // 添加点光源，增强局部照明
            const pointLight = new THREE.PointLight(0xffffff, 0.3);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);
        }
        
        // 安全集成ModelViewer
        let modelViewer, modelScene, archnathidModel, archnathidInstance, modelCanvas;
        let modelViewerReady = false;
        let renderCounter = 0;
        let modelLoadAttempts = 0;
        const MAX_LOAD_ATTEMPTS = 3;
        
        function initModelViewer() {
            // 延迟初始化ModelViewer，确保Three.js场景优先显示
            setTimeout(() => {
                try {
                    logError('开始安全初始化ModelViewer...', 'info');
                    
                    // 创建ModelViewer容器
                    const modelContainer = document.getElementById('model-container');
                    if (!modelContainer) {
                        logError('ModelViewer容器不存在', 'error');
                        return;
                    }
                    
                    // 创建canvas用于ModelViewer
                    modelCanvas = document.createElement('canvas');
                    modelCanvas.id = 'model-canvas';
                    modelCanvas.width = window.innerWidth;
                    modelCanvas.height = window.innerHeight;
                    modelCanvas.style.position = 'absolute';
                    modelCanvas.style.top = '0';
                    modelCanvas.style.left = '0';
                    modelCanvas.style.pointerEvents = 'none'; // 让鼠标事件穿透到Three.js场景
                    modelCanvas.style.zIndex = '20'; // 确保在Three.js场景之上
                    modelCanvas.style.backgroundColor = 'transparent'; // 确保背景透明
                    modelContainer.appendChild(modelCanvas);
                    
                    // 检查ModelViewer库是否加载
                    if (!ModelViewer || !ModelViewer.viewer || !ModelViewer.viewer.ModelViewer) {
                        logError('ModelViewer库未正确加载', 'error');
                        return;
                    }
                    
                    // 创建ModelViewer实例
                    try {
                        modelViewer = new ModelViewer.viewer.ModelViewer(modelCanvas);
                        logError('ModelViewer实例创建成功', 'info');
                    } catch (e) {
                        logError('创建ModelViewer实例时出错', 'error', e.stack);
                        return;
                    }
                    
                    // 添加处理器
                    try {
                        if (ModelViewer.viewer.handlers) {
                            if (ModelViewer.viewer.handlers.mdx) {
                                modelViewer.addHandler(ModelViewer.viewer.handlers.mdx);
                                logError('MDX处理器添加成功', 'info');
                            } else {
                                logError('MDX处理器不存在', 'warning');
                            }
                            if (ModelViewer.viewer.handlers.blp) {
                                modelViewer.addHandler(ModelViewer.viewer.handlers.blp);
                                logError('BLP处理器添加成功', 'info');
                            } else {
                                logError('BLP处理器不存在', 'warning');
                            }
                        } else {
                            logError('ModelViewer处理器未加载', 'error');
                            return;
                        }
                    } catch (e) {
                        logError('添加处理器时出错', 'error', e.stack);
                    }
                    
                    // 创建场景
                    try {
                        modelScene = modelViewer.addScene();
                        if (modelScene) {
                            logError('ModelViewer场景创建成功', 'info');
                        } else {
                            logError('无法创建ModelViewer场景', 'error');
                            return;
                        }
                    } catch (e) {
                        logError('创建ModelViewer场景时出错', 'error', e.stack);
                        return;
                    }
                    
                    // 添加增强的ModelViewer事件监听器
                    try {
                        if (modelViewer.on) {
                            modelViewer.on('error', (errorEvent) => {
                                try {
                                    const errorMessage = errorEvent.error || errorEvent.message || 'Unknown error';
                                    const fetchUrl = errorEvent.fetchUrl || 'Unknown URL';
                                    
                                    if (errorMessage.includes('Http Error')) {
                                        logError('ModelViewer资源加载错误', 'warning', `错误: ${errorMessage}, URL: ${fetchUrl}`);
                                    } else {
                                        logError('ModelViewer错误事件', 'error', errorEvent);
                                    }
                                } catch (e) {
                                    console.error('处理ModelViewer错误事件时出错:', e);
                                }
                            });
                            
                            modelViewer.on('load', (data) => {
                                logError('ModelViewer加载事件', 'info', data);
                            });
                        }
                        logError('ModelViewer事件监听器添加成功', 'info');
                    } catch (e) {
                        logError('添加ModelViewer事件监听器失败', 'warning', e.stack);
                    }
                    
                    // 增强的路径解析器 - 专业版
                    function pathSolver(src) {
                        try {
                            logError('=== 路径解析请求 ===', 'info');
                            logError('原始路径: ' + src, 'info');
                            
                            // 处理ReplaceableTextures路径 - 跳过这些路径
                            if (src.includes('ReplaceableTextures') || src.includes('Splats')) {
                                logError('跳过路径: ' + src + ' (系统纹理)', 'info');
                                return '';
                            }
                            
                            // 处理纹理文件路径
                            else if (src.includes('.blp') || src.includes('.dds') || src.includes('.tga') || src.includes('.png') || src.includes('.jpg')) {
                                // 提取文件名
                                const fileName = src.split('\\').pop().split('/').pop();
                                logError('提取的文件名: ' + fileName, 'info');
                                
                                if (fileName) {
                                    // 构建完整的纹理路径
                                    const texturePath = `../../src/model/Creeps/Archnathid/${fileName}`;
                                    logError('解析后的纹理路径: ' + texturePath, 'info');
                                    
                                    // 验证纹理文件是否存在
                                    fetch(texturePath, { method: 'HEAD' })
                                        .then(response => {

                            return '';

                                }
                            }
                            
                            // 创建新实例
                            archnathidInstance = model.addInstance();
                            if (archnathidInstance) {
                                archnathidInstance.setScene(modelScene);
                                archnathidInstance.setSequence(0);
                                archnathidInstance.setSequenceLoopMode(2);
                                logError('Archnathid模型实例创建成功！', 'info');
                                modelViewerReady = true;
                            }
                        } catch (e) {
                            logError('创建模型实例时出错', 'error', e.stack);
                        }
                    } else {
                        logError('Archnathid模型加载失败！', 'error');
                    }
                }).catch(error => {
                    logError('加载模型时出错', 'error', error.message);
                });
            } catch (e) {
                logError('启动模型加载时出错', 'error', e.stack);
            }
        }
        
        // 重置ModelViewer
        function resetModelViewer() {
            logError('开始重置ModelViewer...', 'info');
            
            try {
                // 清理实例
                if (archnathidInstance) {
                    try {
                        archnathidInstance.dispose();
                    } catch (e) {
                        logError('清理模型实例时出错', 'warning', e.stack);
                    }
                    archnathidInstance = null;
                }
                
                // 清理模型
                if (archnathidModel) {
                    try {
                        archnathidModel.dispose();
                    } catch (e) {
                        logError('清理模型时出错', 'warning', e.stack);
                    }
                    archnathidModel = null;
                }
                
                // 清理场景
                if (modelScene) {
                    try {
                        modelViewer.removeScene(modelScene);
                    } catch (e) {
                        logError('移除场景时出错', 'warning', e.stack);
                    }
                    modelScene = null;
                }
                
                // 重新创建场景
                try {
                    modelScene = modelViewer.addScene();
                    if (modelScene) {
                        logError('ModelViewer场景重新创建成功', 'info');
                    } else {
                        logError('无法重新创建ModelViewer场景', 'error');
                    }
                } catch (e) {
                    logError('创建ModelViewer场景时出错', 'error', e.stack);
                }
                
                modelViewerReady = false;
                renderCounter = 0;
                logError('ModelViewer重置完成', 'info');
            } catch (e) {
                logError('重置ModelViewer时出错', 'error', e.stack);
            }
        }
        
        // 测试ModelViewer功能
        function testModelViewer() {
            logError('开始测试ModelViewer功能...', 'info');
            
            try {
                if (!modelViewer) {
                    logError('ModelViewer未初始化', 'error');
                    return;
                }
                
                // 测试ModelViewer基本功能
                logError('ModelViewer实例存在: ' + !!modelViewer, 'info');
                logError('ModelViewer版本: ' + (ModelViewer.version || '未知'), 'info');
                logError('ModelViewerReady状态: ' + modelViewerReady, 'info');
                logError('Archnathid模型加载状态: ' + !!archnathidModel, 'info');
                logError('Archnathid实例创建状态: ' + !!archnathidInstance, 'info');
                logError('ModelScene创建状态: ' + !!modelScene, 'info');
                
                // 测试Canvas状态
                if (modelCanvas) {
                    logError('ModelCanvas尺寸: ' + modelCanvas.width + 'x' + modelCanvas.height, 'info');
                    logError('ModelCanvas可见性: ' + (modelCanvas.style.display !== 'none'), 'info');
                }
                
                logError('ModelViewer功能测试完成', 'info');
            } catch (e) {
                logError('测试ModelViewer功能时出错', 'error', e.stack);
            }
        }
        
        // 高级动画循环 - 实现时间分片渲染
        function animate() {
            requestAnimationFrame(animate);
            
            // 移动相机
            try {
                moveCamera();
            } catch (e) {
                logError('移动相机时出错', 'error', e.stack);
            }
            
            // 更新控制器
            try {
                controls.update();
            } catch (e) {
                logError('更新控制器时出错', 'error', e.stack);
            }
            
            // 时间分片渲染策略
            try {
                if (modelViewerRenderEnabled && modelViewer && modelViewerReady) {
                    // 实现时间分片渲染，避免WebGL上下文冲突
                    renderPhase++;
                    
                    // 每2帧渲染一次ModelViewer，Three.js每一帧都渲染
                    if (renderPhase % 2 === 0) {
                        // 渲染ModelViewer
                        try {
                            modelViewer.updateAndRender();
                            logError('ModelViewer渲染成功 (时间分片)', 'info');
                        } catch (mvError) {
                            logError('ModelViewer渲染出错 (时间分片)', 'warning', mvError.stack || mvError.message);
                            // 不禁用ModelViewer，允许继续尝试
                        }
                    }
                    
                    // 始终渲染Three.js场景
                    try {
                        renderer.render(scene, camera);
                    } catch (e) {
                        logError('渲染Three.js场景时出错', 'error', e.stack);
                    }
                } else {
                    // 只渲染Three.js场景
                    try {
                        renderer.render(scene, camera);
                    } catch (e) {
                        logError('渲染Three.js场景时出错', 'error', e.stack);
                    }
                    
                    // 记录ModelViewer状态
                    if (modelViewer && modelViewerReady) {
                        if (renderCounter % 10 === 0) {
                            logError('ModelViewer已就绪，但渲染已禁用', 'info');
                        }
                        renderCounter++;
                    }
                }
            } catch (e) {
                // 只记录警告，不影响Three.js渲染
                logError('处理渲染时出错', 'warning', e.stack);
                
                // 确保Three.js场景始终能够渲染
                try {
                    renderer.render(scene, camera);
                } catch (renderError) {
                    logError('渲染Three.js场景时出错', 'error', renderError.stack);
                }
            }
        }
        
        // 启动场景
        initScene();
    </script>
</body>
</html>
