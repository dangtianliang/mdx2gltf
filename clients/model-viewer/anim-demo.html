<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLTF 动画播放 Demo</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.7); color: white;
            padding: 15px; border-radius: 8px;
            max-width: 400px;
        }
        #controls {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 15px; border-radius: 8px;
            display: flex; gap: 10px;
        }
        button {
            padding: 10px 20px; cursor: pointer;
            background: #4CAF50; color: white;
            border: none; border-radius: 4px;
        }
        button:hover { background: #45a049; }
        button:disabled { background: #666; cursor: not-allowed; }
        #status { color: #4CAF50; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>🎬 GLTF 动画播放 Demo</h3>
        <p>这个 demo 测试 GLTF 动画数据是否能正确播放。</p>
        <div id="status">加载中...</div>
    </div>
    
    <div id="controls">
        <button id="playBtn" disabled>播放</button>
        <button id="pauseBtn" disabled>暂停</button>
        <button id="resetBtn" disabled>重置</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        
        // 网格辅助
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);
        
        // 动画相关变量
        let mixer = null;
        let action = null;
        let clock = new THREE.Clock();
        
        // 加载 GLTF 文件
        const loader = new THREE.GLTFLoader();
        const gltfUrl = '../test_anim.gltf';
        
        loader.load(gltfUrl, (gltf) => {
            console.log('GLTF 加载成功:', gltf);
            
            // 添加模型到场景
            const model = gltf.scene;
            scene.add(model);
            
            // 检查动画
            const animations = gltf.animations;
            console.log('动画数量:', animations.length);
            
            const statusDiv = document.getElementById('status');
            
            if (animations.length > 0) {
                const anim = animations[0];
                console.log('动画信息:', {
                    name: anim.name,
                    duration: anim.duration,
                    tracks: anim.tracks.length
                });
                
                // 创建动画混合器
                mixer = new THREE.AnimationMixer(model);
                action = mixer.clipAction(anim);
                action.setLoop(THREE.LoopRepeat);
                
                statusDiv.innerHTML = `
                    <strong>✅ 动画加载成功</strong><br>
                    名称: ${anim.name}<br>
                    时长: ${anim.duration.toFixed(2)} 秒<br>
                    轨迹数: ${anim.tracks.length}
                `;
                
                // 启用按钮
                document.getElementById('playBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('resetBtn').disabled = false;
                
                // 自动播放
                action.play();
            } else {
                statusDiv.innerHTML = '<strong>⚠️ 没有动画数据</strong>';
            }
        }, (progress) => {
            console.log('加载进度:', progress);
        }, (error) => {
            console.error('加载失败:', error);
            document.getElementById('status').innerHTML = '<strong>❌ 加载失败: ' + error.message + '</strong>';
        });
        
        // 按钮事件
        document.getElementById('playBtn').addEventListener('click', () => {
            if (action) action.play();
        });
        
        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (action) action.stop();
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (action) {
                action.reset();
                action.play();
            }
        });
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
