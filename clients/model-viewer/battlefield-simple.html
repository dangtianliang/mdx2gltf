<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战场 - 3D场景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        
        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .scene-info {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
        
        .scene-info h2 {
            margin-bottom: 10px;
            color: #3498db;
        }
        
        .controls {
            margin-top: 10px;
        }
        
        .controls p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <!-- 场景容器 -->
    <div id="scene-container"></div>
    
    <!-- 场景信息 -->
    <div class="scene-info">
        <h2>战场</h2>
        <div class="controls">
            <p><strong>控制方式：</strong></p>
            <p>WASD - 移动相机</p>
            <p>鼠标左键 - 旋转视角</p>
            <p>鼠标滚轮 - 缩放</p>
            <p>空格键 - 重置视角</p>
        </div>
    </div>
    
    <!-- 引入Three.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入轨道控制器 -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        console.log('开始初始化Three.js场景...');
        
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 天空蓝色
        console.log('场景创建成功');
        
        // 相机设置
        const camera = new THREE.PerspectiveCamera(
            75, // 视野角度
            window.innerWidth / window.innerHeight, // 宽高比
            0.1, // 近裁剪面
            1000 // 远裁剪面
        );
        camera.position.set(5, 5, 5); // 相机位置
        camera.lookAt(0, 0, 0); // 相机看向原点
        console.log('相机创建成功');
        
        // 渲染器设置
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('scene-container').appendChild(renderer.domElement);
        console.log('渲染器创建成功');
        
        // 添加轨道控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 启用阻尼效果
        controls.dampingFactor = 0.05; // 阻尼系数
        console.log('控制器创建成功');
        
        // 添加地面网格
        function createGroundGrid() {
            // 创建地面
            const groundGeometry = new THREE.PlaneGeometry(20, 20, 20, 20);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x4caf50,
                side: THREE.DoubleSide,
                wireframe: false
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2; // 旋转地面使其水平
            ground.position.y = -0.5; // 地面位置
            ground.receiveShadow = true;
            scene.add(ground);
            console.log('地面创建成功');
            
            // 创建网格辅助线
            const gridHelper = new THREE.GridHelper(20, 20, 0xffffff, 0x888888);
            gridHelper.position.y = -0.499; // 略微高于地面
            scene.add(gridHelper);
            console.log('网格辅助线创建成功');
        }
        
        // 添加光源
        function addLights() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            console.log('环境光添加成功');
            
            // 方向光（模拟太阳光）
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            directionalLight.shadow.camera.left = -10;
            directionalLight.shadow.camera.right = 10;
            directionalLight.shadow.camera.top = 10;
            directionalLight.shadow.camera.bottom = -10;
            scene.add(directionalLight);
            console.log('方向光添加成功');
        }
        
        // 处理键盘事件（WASD移动相机）
        const keys = {};
        window.addEventListener('keydown', (event) => {
            keys[event.code] = true;
            
            // 空格键重置视角
            if (event.code === 'Space') {
                camera.position.set(5, 5, 5);
                camera.lookAt(0, 0, 0);
                controls.reset();
            }
        });
        
        window.addEventListener('keyup', (event) => {
            keys[event.code] = false;
        });
        
        // 移动相机
        function moveCamera() {
            const speed = 0.1;
            
            if (keys['KeyW']) {
                camera.position.z -= speed;
            }
            if (keys['KeyS']) {
                camera.position.z += speed;
            }
            if (keys['KeyA']) {
                camera.position.x -= speed;
            }
            if (keys['KeyD']) {
                camera.position.x += speed;
            }
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 移动相机
            moveCamera();
            
            // 更新控制器
            controls.update();
            
            // 渲染场景
            renderer.render(scene, camera);
        }
        
        // 初始化场景
        function initScene() {
            try {
                console.log('开始初始化场景...');
                
                createGroundGrid();
                addLights();
                animate();
                
                console.log('场景初始化完成！');
            } catch (error) {
                console.error('场景初始化时出错:', error);
            }
        }
        
        // 启动场景
        initScene();
    </script>
</body>
</html>
