<body>
    <div class="exporter-container">
        <!-- 左侧模型选择 -->
        <div class="model-selection">
            <h2>模型选择</h2>
            <div class="race-categories" id="race-categories">
                <!-- 种族分类将通过JS动态生成 -->
            </div>
        </div>
        
        <!-- 右侧转换和预览 -->

            <!-- 转换选项 -->
            <div class="conversion-options">
                <h2>转换选项</h2>
                <div class="options-grid">
                    <div class="option-group">
                        <label for="output-format">输出格式</label>
                        <select id="output-format">
                            <option value="gltf">GLTF (JSON)</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="embed-textures">嵌入纹理</label>
                        <input type="checkbox" id="embed-textures" checked>
                    </div>
                    <div class="option-group">
                        <label for="include-animations">包含动画</label>
                        <input type="checkbox" id="include-animations" checked>
                    </div>
                    <div class="option-group">
                        <label for="texture-format">纹理格式</label>
                        <select id="texture-format">
                            <option value="png">PNG</option>
                            <option value="jpg">JPG</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="texture-quality">纹理质量</label>

                            <option value="high">高</option>
                            <option value="medium">中</option>
                            <option value="low">低</option>

                    </div>
                    <div class="option-group">
                        <label for="animation-loop">动画循环</label>
                        <input type="checkbox" id="animation-loop" checked>
                    </div>
                    <div class="option-group">
                        <label for="include-skeleton">包含骨骼</label>

                    </div>
                    <div class="option-group">

                            <option value="1">红色</option>

                            <option value="3">青色</option>
                            <option value="4">紫色</option>
                            <option value="5">黄色</option>
                            <option value="6">橙色</option>
                            <option value="7">绿色</option>

                </div>

                    <h3>原始 MDX 预览</h3>

    <script>
        function sendLog(type, message, data = {}) {
            const logData = {
                type: type,
                message: message,
                data: data,
                url: window.location.href,
                userAgent: navigator.userAgent
            };
            
            fetch('http://localhost:8081/api/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(logData)
            }).catch(err => {
                // 静默失败，不影响正常功能
            });
        }
        
        // 全局变量
        let selectedModel = null;
        let scene, camera, renderer, controls;
        let modelMesh = null;
        
        // GLTF 预览相关变量
        let gltfScene, gltfCamera, gltfRenderer, gltfControls;
        let gltfModel = null;
        let gltfAnimations = [];
        let gltfMixer = null;
        let currentAnimationAction = null;
        let isGltfPlaying = false;
        
        // 当前模型的材质文件路径
        let currentMaterialPath = null;
        // 全局占位，保存MDX层级结构（在解析后会被覆盖）
        window.mdxHierarchy = null;
        
        // Warcraft 3 队伍颜色常量
        const TEAM_COLORS = {
            0: null, // 默认 (无队伍颜色)
            1: 0xFF0000, // 红色
            2: 0x0000FF, // 蓝色
            3: 0x00FFFF, // 青色
            4: 0xFF00FF, // 紫色
            5: 0xFFFF00, // 黄色

            7: 0x00FF00, // 绿色

        };
        
        // 初始化函数
        function init() {
            // 初始化3D预览场景
            // initPreviewScene();
            
            // 初始化GLTF预览场景
            initGltfPreviewScene();
            
            // 加载模型列表
            loadModelList();
            
            // 绑定事件
            bindEvents();
            
            // 绑定动画控制事件
            bindAnimationControls();
        }
        
        // 初始化预览场景
        function initPreviewScene() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(
                75,
                document.getElementById('preview-canvas').clientWidth / 
                document.getElementById('preview-canvas').clientHeight,
                0.1,
                1000
            );
            camera.position.z = 5;
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('preview-canvas'),
                antialias: true 
            });
            renderer.setSize(
                document.getElementById('preview-canvas').clientWidth,
                document.getElementById('preview-canvas').clientHeight
            );
            
            // 添加轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
            
            // 渲染循环
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                
                // 如果有模型，自动旋转
                if (modelMesh) {
                    modelMesh.rotation.y += 0.005;
                }
                
                renderer.render(scene, camera);
            }
            
            animate();
        }
        
        // ==================== GLTF 预览功能 ====================
        
        // 初始化 GLTF 预览场景
        function initGltfPreviewScene() {
            // 创建场景
            gltfScene = new THREE.Scene();
            gltfScene.background = new THREE.Color(0xe8f4f8);
            
            // 创建相机
            const canvas = document.getElementById('gltf-preview-canvas');
            gltfCamera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            gltfCamera.position.set(0, 0, 5);
            
            // 创建渲染器
            gltfRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            gltfRenderer.setSize(canvas.clientWidth, canvas.clientHeight);
            gltfRenderer.outputEncoding = THREE.sRGBEncoding;
            
            // 添加轨道控制器
            gltfControls = new THREE.OrbitControls(gltfCamera, canvas);
            gltfControls.enableDamping = true;
            gltfControls.dampingFactor = 0.05;
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            gltfScene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            gltfScene.add(directionalLight);
            
            const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
            backLight.position.set(-5, 0, -5);
            gltfScene.add(backLight);
            
            // 添加网格辅助
            const gridHelper = new THREE.GridHelper(10, 10, 0x888888, 0xcccccc);
            gridHelper.position.y = -2;
            gltfScene.add(gridHelper);
            
            // 渲染循环
            const clock = new THREE.Clock();
            function animateGltf() {
                requestAnimationFrame(animateGltf);
                
                const delta = clock.getDelta();
                
                // 更新动画混合器 - 只要有 mixer 就更新，不管播放状态
                // 因为 mixer 需要持续更新来推进动画时间
                if (gltfMixer) {
                    gltfMixer.update(delta);
                }
                
                gltfControls.update();
                gltfRenderer.render(gltfScene, gltfCamera);
            }
            
            animateGltf();
        }
        
        // 加载 GLTF 数据到预览场景
        function loadGltfPreview(gltfData) {
            
            // 显示加载中
            document.getElementById('gltf-loading').style.display = 'block';
            
            // 清除之前的模型
            if (gltfModel) {
                gltfScene.remove(gltfModel);
                gltfModel = null;
            }
            
            // 重置动画
            gltfAnimations = [];
            gltfMixer = null;
            currentAnimationAction = null;
            isGltfPlaying = false;
            
            // 使用 GLTFLoader 加载数据
            const loader = new THREE.GLTFLoader();
            
            let blobUrl = null;
            try {
                // 将 GLTF 数据转换为 Blob URL
                let blob;
                if (typeof gltfData === 'string') {
                    blob = new Blob([gltfData], { type: 'application/json' });
                } else {
                    blob = new Blob([JSON.stringify(gltfData)], { type: 'application/json' });
                }
                blobUrl = URL.createObjectURL(blob);
                
                loader.load(blobUrl, (gltf) => {
                    // 记录 GLTF 加载成功
                    
                    // 添加模型到场景
                    gltfModel = gltf.scene;
                    gltfScene.add(gltfModel);
                    
                    // 调整相机位置以适应模型
                    fitCameraToModel(gltfModel);
                    
                    // ═══════════════════════════════════════════════════════════
                    // 设置动画
                    // ═══════════════════════════════════════════════════════════
                    if (gltf.animations && gltf.animations.length > 0) {
                        gltfAnimations = gltf.animations;
                        gltfMixer = new THREE.AnimationMixer(gltfModel);
                        
                        
                        // 验证动画是否是有效的 AnimationClip
                        gltfAnimations.forEach((anim, i) => {
                        });
                        
                        // 列出场景中所有对象名称，用于匹配动画轨迹
                        const allNames = [];
                        const boneNames = [];
                        const objectDetails = [];
                        gltfModel.traverse((obj) => {
                            allNames.push(obj.name);
                            if (obj.isBone || obj.isSkinnedMesh) {
                                boneNames.push(obj.name);
                            }
                            objectDetails.push({
                                name: obj.name,
                                type: obj.type,
                                isBone: obj.isBone,
                                isSkinnedMesh: obj.isSkinnedMesh,
                                isMesh: obj.isMesh,
                                isObject3D: obj.isObject3D,
                                uuid: obj.uuid.substring(0, 8)
                            });
                        });
                        // 检查每个动画的轨迹是否能匹配到场景中的对象
                        gltfAnimations.forEach((anim, i) => {
                            if (anim.tracks) {
                                anim.tracks.forEach((track, trackIndex) => {
                                    const targetName = track.name.split('.')[0];
                                    const propertyName = track.name.split('.')[1];
                                    const targetObj = gltfScene.getObjectByName(targetName);
                                });
                            }
                        });
                        
                        // 填充动画选择器
                        const animSelector = document.getElementById('anim-selector');
                        animSelector.innerHTML = '';
                        gltfAnimations.forEach((anim, index) => {
                            const option = document.createElement('option');
                            option.value = index;
                            option.textContent = anim.name || `动画 ${index + 1}`;
                            animSelector.appendChild(option);
                        });
                        
                        // 显示动画控制
                        document.getElementById('animation-controls').style.display = 'block';
                        document.getElementById('anim-info').textContent = 
                            `共 ${gltfAnimations.length} 个动画，当前: ${gltfAnimations[0].name || '动画 1'}`;
                        
                        // 自动播放第一个动画
                        playAnimation(0);
                        
                    } else {
                        document.getElementById('animation-controls').style.display = 'none';
                        document.getElementById('anim-info').textContent = '无动画';
                    }
                    
                    // 隐藏加载中
                    document.getElementById('gltf-loading').style.display = 'none';
                    
                    showStatus('GLTF 预览加载成功！', 'success');
                    
                }, (progress) => {
                }, (error) => {
                    console.error('GLTF 加载失败:', error);
                    document.getElementById('gltf-loading').style.display = 'none';
                    showStatus('GLTF 预览加载失败: ' + error.message, 'error');
                });
                
            } catch (error) {
                console.error('GLTF 预览错误:', error);
                document.getElementById('gltf-loading').style.display = 'none';
                showStatus('GLTF 预览错误: ' + error.message, 'error');
            }
        }
        
        // 调整相机以适应模型
        function fitCameraToModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = gltfCamera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            
            cameraZ *= 2.5; // 添加一些边距
            
            gltfCamera.position.set(center.x, center.y, center.z + cameraZ);
            gltfCamera.lookAt(center);
            
            gltfControls.target.copy(center);
            gltfControls.update();
        }
        
        // 播放指定动画
        function playAnimation(index) {
            if (!gltfMixer || index < 0 || index >= gltfAnimations.length) {
                return;
            }
            
            const animation = gltfAnimations[index];
            
            // 停止当前动画
            if (currentAnimationAction) {
                currentAnimationAction.stop();
            }
            
            // 创建动画动作
            try {
                currentAnimationAction = gltfMixer.clipAction(animation);
            } catch (e) {
                console.error('   clipAction 创建失败:', e);
                return;
            }
            
            // 设置动画参数
            currentAnimationAction.reset();
            currentAnimationAction.clampWhenFinished = false;
            currentAnimationAction.loop = THREE.LoopRepeat;
            
            // 播放动画
            const playResult = currentAnimationAction.play();
            
            isGltfPlaying = true;
            
            document.getElementById('anim-info').textContent = 
                `▶️ 播放中: ${animation.name || '动画 ' + (index + 1)} (${animation.duration.toFixed(2)}秒)`;
            
            
            // 打印动画轨迹信息
            if (animation.tracks) {
                animation.tracks.forEach((track, i) => {
                });
            }
        }
        
        // 绑定动画控制事件
        function bindAnimationControls() {
            // 播放按钮
            document.getElementById('anim-play-btn').addEventListener('click', () => {
                
                if (currentAnimationAction) {
                    
                    
                    try {
                        currentAnimationAction.play();
                        isGltfPlaying = true;
                        
                        const playState = currentAnimationAction.isRunning();
                        
                        
                        // 更新UI
                        document.getElementById('anim-info').textContent = 
                            `▶ 播放中: ${currentAnimationAction.getClip().name}`;
                        
                    } catch (error) {
                        console.error('播放动画失败:', error);
                    }
                } else {
                }
            });
            
            // 暂停按钮
            document.getElementById('anim-pause-btn').addEventListener('click', () => {
                
                if (currentAnimationAction) {
                    
                    currentAnimationAction.paused = true;
                    isGltfPlaying = false;
                    document.getElementById('anim-info').textContent = 
                        `⏸️ 已暂停: ${currentAnimationAction.getClip().name}`;
                    
                }
            });
            
            // 停止按钮
            document.getElementById('anim-stop-btn').addEventListener('click', () => {
                
                if (currentAnimationAction) {
                    
                    currentAnimationAction.stop();
                    isGltfPlaying = false;
                    document.getElementById('anim-info').textContent = 
                        `⏹️ 已停止: ${currentAnimationAction.getClip().name}`;
                    
                }
            });
            
            // 动画选择器
            document.getElementById('anim-selector').addEventListener('change', (e) => {
                const animationIndex = parseInt(e.target.value);
                
                
                playAnimation(animationIndex);
            });
        }

                        // ═══════════════════════════════════════════════════════════════

                        // ═══════════════════════════════════════════════════════════════

                         * 支持两种格式:

                         * 2. 新格式: { Keys: [{Frame, Vector, InTan, OutTan}, ...], LineType, GlobalSeqId }

                            const values = [];

                            // ═══════════════════════════════════════════════════════════
                            if (mdxAnim.Keys && Array.isArray(mdxAnim.Keys)) {
                                const keys = mdxAnim.Keys;
                                if (keys.length === 0) return { times, values, interpolationType: 0 };

                                // 逻辑优化：
                                // 1. 找到 startFrame 之前的最后一个关键帧 (preKey)
                                // 2. 找到 endFrame 之后的第一个关键帧 (postKey)
                                // 3. 收集 [startFrame, endFrame] 之间的所有关键帧
                                // 这样可以确保动画首尾衔接正确
                                
                                let validKeys = [];

                                // 这里简化处理：如果没有关键帧，就不输出动画

                                     if (keys.length > 0) {

                                const p1 = [];
                                const m0 = [];
                                const m1 = [];
                                
                                for (let j = 0; j < valueSize; j++) {
                                    p0.push(values[i * valueSize + j]);
                                    p1.push(values[(i + 1) * valueSize + j]);
                                    // 注意: War3 MDX 的切线是 "InTan" 和 "OutTan"
                                    // Hermite 插值公式: p(t) = (2t^3 - 3t^2 + 1)p0 + (t^3 - 2t^2 + t)m0 + (-2t^3 + 3t^2)p1 + (t^3 - t^2)m1
                                    // m0 是这一帧的 OutTan, m1 是下一帧的 InTan
                                    m0.push(outTans && outTans.length > i ? outTans[i][j] : 0);
                                    m1.push(inTans && inTans.length > i + 1 ? inTans[i + 1][j] : 0);

                                for (let s = 0; s < samplesPerSegment; s++) {

                                    const time = t0 + (duration * t);
                                    newTimes.push(time);

                                    const t2 = t * t;
                                    const t3 = t2 * t;
                                    const h1 = 2 * t3 - 3 * t2 + 1;
                                    const h2 = t3 - 2 * t2 + t;
                                    const h3 = -2 * t3 + 3 * t2;
                                    const h4 = t3 - t2;
                                    
                                    for (let j = 0; j < valueSize; j++) {
                                        const val = h1 * p0[j] + h2 * m0[j] + h3 * p1[j] + h4 * m1[j];
                                        newValues.push(val);
                                    }
                                }
                            }
                            
                            // 添加最后一个点
                            newTimes.push(times[times.length - 1]);
                            for (let j = 0; j < valueSize; j++) {
                                newValues.push(values[(times.length - 1) * valueSize + j]);
                            }
                            
                            return { times: newTimes, values: newValues, interpolationType: 1 };

                        // 创建蒙皮几何体的函数（改进版）

        // 将1像素平面设置为透明材质
        function makeOnePixelPlanesTransparent(object) {
            let transparentCount = 0;
            
            // 计算三角形面积
            function calculateTriangleArea(v0, v1, v2) {
                // 使用向量叉积计算三角形面积
                const v1v0 = new THREE.Vector3().subVectors(v1, v0);
                const v2v0 = new THREE.Vector3().subVectors(v2, v0);
                const crossProduct = new THREE.Vector3().crossVectors(v1v0, v2v0);
                return 0.5 * crossProduct.length();
            }
            
            // 创建透明材质
            const transparentMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                opacity: 0.0,
                transparent: true,
                side: THREE.DoubleSide
            });
            
            // 遍历对象及其子对象
            object.traverse((child) => {
                if (child.isMesh || child.isSkinnedMesh) {
                    const mesh = child;
                    const geometry = mesh.geometry;
                    
                    if (geometry && geometry.isBufferGeometry) {
                        // 获取顶点和索引数据
                        const positionAttribute = geometry.attributes.position;
                        const indexAttribute = geometry.index;
                        
                        if (positionAttribute && indexAttribute) {
                            const positions = positionAttribute.array;
                            const indices = indexAttribute.array;
                            
                            // 检查网格是否主要由1像素平面组成
                            let totalTriangles = indices.length / 3;
                            let smallTriangles = 0;
                            
                            // 遍历所有三角形，计算小三角形的数量
                            for (let i = 0; i < indices.length; i += 3) {
                                // 获取三角形的三个顶点索引
                                const i0 = indices[i] * 3;
                                const i1 = indices[i + 1] * 3;
                                const i2 = indices[i + 2] * 3;
                                
                                // 获取三个顶点的位置
                                const v0 = new THREE.Vector3(
                                    positions[i0], positions[i0 + 1], positions[i0 + 2]
                                );
                                const v1 = new THREE.Vector3(
                                    positions[i1], positions[i1 + 1], positions[i1 + 2]
                                );
                                const v2 = new THREE.Vector3(
                                    positions[i2], positions[i2 + 1], positions[i2 + 2]
                                );
                                
                                // 计算三角形的面积
                                const area = calculateTriangleArea(v0, v1, v2);
                                
                                // 定义1像素平面的面积阈值（根据实际情况调整）
                                const areaThreshold = 0.001; // 面积小于此值的三角形被视为1像素平面
                                
                                // 统计小三角形的数量
                                if (area <= areaThreshold) {
                                    smallTriangles++;
                                }
                            }
                            
                            // 如果网格中超过90%的三角形都是小三角形，则将整个网格设置为透明材质
                            if (smallTriangles > 0 && (smallTriangles / totalTriangles) > 0.9) {
                                mesh.material = transparentMaterial;
                                transparentCount++;
                            }
                        }
                    }
                }
            });
