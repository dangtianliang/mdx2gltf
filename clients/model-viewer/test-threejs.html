<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        
        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <!-- 场景容器 -->
    <div id="scene-container"></div>
    
    <!-- 信息面板 -->
    <div class="info">
        <h2>Three.js测试页面</h2>
        <p>如果能看到蓝色背景和白色立方体，则Three.js正常工作</p>
    </div>
    
    <!-- 引入Three.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        console.log('开始初始化Three.js场景...');
        
        try {
            // 场景设置
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // 天空蓝色
            console.log('场景创建成功');
            
            // 相机设置
            const camera = new THREE.PerspectiveCamera(
                75, // 视野角度
                window.innerWidth / window.innerHeight, // 宽高比
                0.1, // 近裁剪面
                1000 // 远裁剪面
            );
            camera.position.set(5, 5, 5); // 相机位置
            camera.lookAt(0, 0, 0); // 相机看向原点
            console.log('相机创建成功');
            
            // 渲染器设置
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('scene-container').appendChild(renderer.domElement);
            console.log('渲染器创建成功');
            
            // 添加立方体
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            console.log('立方体添加成功');
            
            // 动画循环
            function animate() {
                requestAnimationFrame(animate);
                
                // 旋转立方体
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                
                // 渲染场景
                renderer.render(scene, camera);
            }
            
            // 启动动画循环
            animate();
            console.log('动画循环启动成功');
            console.log('Three.js场景初始化完成');
        } catch (error) {
            console.error('Three.js初始化出错:', error);
        }
    </script>
</body>
</html>
